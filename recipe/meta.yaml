{% set name = "scikit-build" %}
{% set version = "0.19.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/scikit_build-{{ version }}.tar.gz
  sha256: b9a8d07fca2d5d10d93220bc57a685161d72af1fc76285d55c564ddaa862e584

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-fancy-pypi-readme
    - hatch-vcs
  run:
    - python
    - distro
    - packaging
    - setuptools >=42.0.0
    - wheel >=0.32.0
    - tomli # [py<311]

test:
  imports:
    - skbuild
  source_files:
    - tests/*
    - pyproject.toml
  requires:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - cmake
    - libpython # [py>=315] for test_get_python_library
    - cython
    - git
    - make  # [not win]
    - ninja
    - pip
    - pytest >=6.0.0
    - pytest-mock >=1.10.4
    - requests
    - setuptools
    - virtualenv
    - wheel

about:
  home: https://github.com/scikit-build/scikit-build
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Improved build system generator for CPython C extensions.
  description: |
    scikit-build is an improved build system generator for CPython
    C/C++/Fortran/Cython extensions. It provides better support for additional
    compilers, build systems, cross compilation, and locating dependencies and
    their associated build requirements. The scikit-build package is
    fundamentally just glue between the setuptools Python module and CMake.

  doc_url: https://scikit-build.readthedocs.io
  dev_url: https://github.com/scikit-build/scikit-build

extra:
  recipe-maintainers:
    - isuruf
    - scopatz
    - jcfr
    - msarahan
  skip-lints:
    - python_build_tools_in_host  # setuptools is a runtime dep (setuptools ↔ CMake glue)
